# VoiceGuard AI - Google Cloud Build Configuration
# CI/CD pipeline: Build Docker image → Push to Container Registry → Deploy to Cloud Run
# Include steps for installing dependencies, running tests, and deploying with proper IAM roles

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/voiceguard-backend', './backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/voiceguard-frontend', './frontend']
images:
  - 'gcr.io/$PROJECT_ID/voiceguard-backend'
  - 'gcr.io/$PROJECT_ID/voiceguard-frontend'
