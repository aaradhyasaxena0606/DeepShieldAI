steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/voiceguard-backend', './backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/voiceguard-frontend', './frontend']
images:
  - 'gcr.io/$PROJECT_ID/voiceguard-backend'
  - 'gcr.io/$PROJECT_ID/voiceguard-frontend'
