# VoiceGuard AI - Docker Compose Configuration
# Define 3 services: frontend (nginx:alpine serving React build), backend (python:3.9 with FastAPI), ml-service (optional)
# Set environment variables, expose ports (3000, 8000), mount volumes for models

version: '3.9'
services:
  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
